<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Santillan Native Products POS</title>
    <link rel="icon" type="image/png" href="assets/logo-new.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "Poppins", "system-ui", "sans-serif"],
            },
            colors: {
              sidebar: {
                DEFAULT: "#0f172a",
                hover: "#1e293b",
                active: "#2563eb",
              },
              accent: {
                DEFAULT: "#2d6a4f",
                light: "#d8f3dc",
              },
            },
            boxShadow: {
              card: "0 4px 24px rgba(15, 23, 42, 0.06)",
              soft: "0 2px 12px rgba(15, 23, 42, 0.04)",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: Inter, Poppins, system-ui, sans-serif;
      }
      .scrollbar-thin {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 transparent;
      }
      .page-enter {
        animation: pageIn 0.2s ease-out;
      }
      @keyframes pageIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body class="antialiased bg-slate-50 text-slate-800">
    <div id="root"></div>
    <script src="dist/bundle.js?v=gh-pages-7"></script>
  </body>
</html>
